name: Upstream Watch
run-name: Upstream Watch - ${{ inputs.model || 'scheduled' }}

on:
  # 取消定时巡检编译，仅在代码提交推送或手动触发时执行
  # schedule:
  #   - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "wrt_core/deconfig/s20l_immwrt.config"
      - "wrt_core/compilecfg/s20l_immwrt.ini"
      - "wrt_core/deconfig/s20l_immwrt_1024m.config"
      - "wrt_core/compilecfg/s20l_immwrt_1024m.ini"
      - "wrt_core/deconfig/compile_base.config"
      - "wrt_core/deconfig/fragments/**"
      - "wrt_core/modules/**"
      - "wrt_core/patches/**"
      - "wrt_core/update.sh"
      - "wrt_core/pre_clone_action.sh"
      - "wrt_core/ci/detect_upstream_changes.sh"
      - "build.sh"
      - ".github/workflows/release_wrt.yml"
      - ".github/workflows/upstream_watch.yml"
  workflow_dispatch:
    inputs:
      model:
        description: Monitored build configuration
        required: true
        type: choice
        default: all
        options:
          - all
          - s20l_immwrt
          - s20l_immwrt_1024m
      force_build:
        description: Build even when the fingerprint was already released
        required: true
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      count: ${{ steps.detect.outputs.count }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Detect Upstream Changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_MODEL: ${{ inputs.model || 'all' }}
          FORCE_BUILD: ${{ inputs.force_build || false }}
        run: |
          echo '| Config | Branch | Commit | Action |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- | --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          bash wrt_core/ci/detect_upstream_changes.sh

  build:
    needs: detect
    if: ${{ needs.detect.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/release_wrt.yml
    with:
      model: ${{ matrix.model }}
      add_fragments: ""
      remove_fragments: ""
      upstream_sha: ${{ matrix.upstream_sha }}
      build_fingerprint: ${{ matrix.fingerprint }}
    secrets: inherit
